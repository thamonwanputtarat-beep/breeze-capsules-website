<body>

    <div id="root"></div>

    <script type="text/babel">
        // Initial dataset for Breeze Booths & Vending Machines with exact coordinates
        const INITIAL_LOCATIONS = [
            {
                id: 'b1',
                name: 'Breeze Bubble World Siam Paragon',
                type: 'BOOTH',
                lat: 13.7460,
                lng: 100.5348,
                address: 'ลาน Parc Paragon ชั้น M ศูนย์การค้าสยามพารากอน กรุงเทพฯ',
                startDate: '2026-10-15',

                status: 'ACTIVE',
                note: 'มีกิจกรรมถ่ายรูปคู่มาสคอต รับฟรี Breeze Capsules 1 ซองเล็ก',
                isDemo: true,

            },
            {
                id: 'b2',
                name: 'Breeze Clean & Fun CentralWorld',
                type: 'BOOTH',
                lat: 13.7469,
                lng: 100.5391,
                address: 'โซน Eden ชั้น 1 ศูนย์การค้าเซ็นทรัลเวิลด์ กรุงเทพฯ',
                startDate: '2026-10-18',
                endDate: '2026-10-31',
                time: '10:00 - 22:00 น.',
                status: 'ACTIVE',
                note: 'ซุ้มเวิร์กช็อปขจัดคราบหนัก พร้อมแจกคูปองส่วนลด 20 บาท',
                isDemo: true,
                updatedAt: '2026-10-14'
            },
            {
                id: 'v1',
                name: 'ตู้กด Breeze Vending MRT สุขุมวิท',
                type: 'VENDING',
                lat: 13.7371,
                lng: 100.5604,
                address: 'สถานีรถไฟฟ้า MRT สุขุมวิท บริเวณทางออก 1',
                startDate: '2026-10-01',
                endDate: '2026-12-31',
                time: '06:00 - 23:59 น.',
                status: 'ACTIVE',
                note: 'ตู้กดอัตโนมัติรับชำระผ่าน PromptPay และ TrueMoney',
                isDemo: true,
                updatedAt: '2026-10-14'
            },
            {
                id: 'v2',
                name: 'ตู้กด Breeze Vending Mega Bangna',
                type: 'VENDING',
                lat: 13.6468,
                lng: 100.6802,
                address: 'เมกาบางนา โซน Foodwalk ชั้น G ใกล้ประตูทางเข้า',
                startDate: '2026-10-10',
                endDate: '2026-11-30',
                time: '10:00 - 22:00 น.',
                status: 'ACTIVE',
                note: 'ซื้อ 2 แถม 1 เมื่อกดผ่านตู้บริการอัตโนมัติ',
                isDemo: true,
                updatedAt: '2026-10-14'
            },
            {
                id: 'b3',
                name: 'Breeze Pop-up Booth ICONSIAM',
                type: 'BOOTH',
                lat: 13.7267,
                lng: 100.5108,
                address: 'ชั้น G ริเวอร์ พาร์ค ไอคอนสยาม',
                startDate: '2026-11-01',
                endDate: '2026-11-15',
                time: '11:00 - 21:00 น.',
                status: 'UPCOMING',
                note: 'กิจกรรมการแสดงไฟ และฟองสบู่ยักษ์ริมแม่น้ำเจ้าพระยา',
                isDemo: true,
                updatedAt: '2026-10-14'
            }
        ];

        const App = () => {
            // Navigation State
            const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);

            // Product Selection Modal State
            const [selectedProduct, setSelectedProduct] = React.useState(null);

            // Google Maps API Key State (Configurable)
            const DEFAULT_MAPS_KEY = 'AIzaSyBcDdShehJqX9XvIPwDXKpWPy4GN4AKxxQ';
            const [googleApiKey, setGoogleApiKey] = React.useState(() => {
                return localStorage.getItem('breeze_gmaps_api_key') || DEFAULT_MAPS_KEY;
            });
            const [isMapLoaded, setIsMapLoaded] = React.useState(false);
            const [mapLoadError, setMapLoadError] = React.useState(false);

            // Map & Locations State
            const [locations, setLocations] = React.useState(() => {
                const saved = localStorage.getItem('breeze_locations');
                return saved ? JSON.parse(saved) : INITIAL_LOCATIONS;
            });
            const [searchQuery, setSearchQuery] = React.useState('');
            const [filterType, setFilterType] = React.useState('ALL'); // ALL, BOOTH, VENDING, ACTIVE, UPCOMING
            const [userCoords, setUserCoords] = React.useState(null);
            const [selectedLocation, setSelectedLocation] = React.useState(null);
            const [geoError, setGeoError] = React.useState('');
            const [isLocating, setIsLocating] = React.useState(false);

            // Google Maps Instance References
            const mapRef = React.useRef(null);
            const gmapInstanceRef = React.useRef(null);
            const markersRef = React.useRef([]);
            const activeInfoWindowRef = React.useRef(null);

            // Admin Panel Toggle
            const [showAdmin, setShowAdmin] = React.useState(false);

            // Mini Game / Voucher State
            const [voucherModal, setVoucherModal] = React.useState(false);
            const [claimedVoucher, setClaimedVoucher] = React.useState(null);

            // Notification Toast
            const [toastMessage, setToastMessage] = React.useState('');

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3500);
            };

            // Save locations to LocalStorage
            React.useEffect(() => {
                localStorage.setItem('breeze_locations', JSON.stringify(locations));
            }, [locations]);

            // Save Google Maps API Key
            const handleSaveApiKey = (key) => {
                setGoogleApiKey(key);
                localStorage.setItem('breeze_gmaps_api_key', key);
                showToast('บันทึก Google Maps API Key เรียบร้อยแล้ว');
            };

            // Dynamic Script Injection for Google Maps JS API
            React.useEffect(() => {
                if (window.google && window.google.maps) {
                    setIsMapLoaded(true);
                    setMapLoadError(false);
                    return;
                }

                // If key is present, attempt script load
                if (googleApiKey) {
                    const scriptId = 'google-maps-js-sdk';
                    let existingScript = document.getElementById(scriptId);

                    if (existingScript) {
                        existingScript.remove();
                    }

                    window.initBreezeGMap = () => {
                        setIsMapLoaded(true);
                        setMapLoadError(false);
                    };

                    const script = document.createElement('script');
                    script.id = scriptId;
                    script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(googleApiKey)}&callback=initBreezeGMap&libraries=places`;
                    script.async = true;
                    script.defer = true;
                    script.onerror = () => {
                        setMapLoadError(true);
                        setIsMapLoaded(false);
                    };

                    document.head.appendChild(script);
                } else {
                    setIsMapLoaded(false);
                }
            }, [googleApiKey]);

            // Calculate distance in kilometers using Haversine formula
            const calculateDistance = (lat1, lon1, lat2, lon2) => {
                const R = 6371; // Radius of Earth in KM
                const dLat = (lat2 - lat1) * (Math.PI / 180);
                const dLon = (lon2 - lon1) * (Math.PI / 180);
                const a = 
                    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return (R * c).toFixed(1);
            };

            // Geolocation handler
            const handleGetCurrentLocation = () => {
                setIsLocating(true);
                setGeoError('');
                if (!navigator.geolocation) {
                    setGeoError('เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง GPS');
                    setIsLocating(false);
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const coords = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        setUserCoords(coords);
                        setIsLocating(false);
                        showToast('ระบุตำแหน่งของคุณสำเร็จ! แสดงระยะห่างไปยังตู้กดและบูธ');

                        // Pan Google Map to user location
                        if (gmapInstanceRef.current && window.google && window.google.maps) {
                            gmapInstanceRef.current.panTo(coords);
                            gmapInstanceRef.current.setZoom(14);
                        }
                    },
                    (error) => {
                        setIsLocating(false);
                        if (error.code === error.PERMISSION_DENIED) {
                            setGeoError('โปรดอนุญาตสิทธิ์เข้าถึงตำแหน่งเพื่อค้นหาจุดที่ใกล้คุณที่สุด');
                        } else {
                            setGeoError('ไม่สามารถดึงตำแหน่งปัจจุบันได้ กรุณาลองอีกครั้ง');
                        }
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            };

            // Filtered locations
            const filteredLocations = React.useMemo(() => {
                return locations.filter(loc => {
                    const matchSearch = loc.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                        loc.address.toLowerCase().includes(searchQuery.toLowerCase());
                    
                    let matchFilter = true;
                    if (filterType === 'BOOTH') matchFilter = loc.type === 'BOOTH';
                    else if (filterType === 'VENDING') matchFilter = loc.type === 'VENDING';
                    else if (filterType === 'ACTIVE') matchFilter = loc.status === 'ACTIVE';
                    else if (filterType === 'UPCOMING') matchFilter = loc.status === 'UPCOMING';

                    return matchSearch && matchFilter;
                }).map(loc => {
                    if (userCoords) {
                        return {
                            ...loc,
                            distance: calculateDistance(userCoords.lat, userCoords.lng, loc.lat, loc.lng)
                        };
                    }
                    return loc;
                }).sort((a, b) => {
                    if (a.distance && b.distance) {
                        return parseFloat(a.distance) - parseFloat(b.distance);
                    }
                    return 0;
                });
            }, [locations, searchQuery, filterType, userCoords]);

            // Google Map initialization and marker syncing
            React.useEffect(() => {
                if (!isMapLoaded || !window.google || !window.google.maps || !mapRef.current) return;

                // Create Map Instance if not exists
                if (!gmapInstanceRef.current) {
                    const defaultCenter = { lat: 13.7460, lng: 100.5348 }; // Bangkok Center
                    const mapOptions = {
                        center: defaultCenter,
                        zoom: 12,
                        mapTypeId: window.google.maps.MapTypeId.ROADMAP,
                        zoomControl: true,
                        mapTypeControl: false,
                        streetViewControl: false,
                        fullscreenControl: true,
                        gestureHandling: 'greedy',
                        styles: [
                            {
                                "featureType": "water",
                                "elementType": "geometry",
                                "stylers": [{ "color": "#e9e9e9" }, { "lightness": 17 }]
                            },
                            {
                                "featureType": "landscape",
                                "elementType": "geometry",
                                "stylers": [{ "color": "#f5f5f5" }, { "lightness": 20 }]
                            }
                        ]
                    };
                    gmapInstanceRef.current = new window.google.maps.Map(mapRef.current, mapOptions);
                }

                const map = gmapInstanceRef.current;

                // Clear existing markers
                markersRef.current.forEach(m => m.setMap(null));
                markersRef.current = [];

                // User Location Marker
                if (userCoords) {
                    const userMarker = new window.google.maps.Marker({
                        position: userCoords,
                        map: map,
                        title: 'ตำแหน่งของคุณ',
                        icon: {
                            path: window.google.maps.SymbolPath.CIRCLE,
                            scale: 8,
                            fillColor: '#00529C',
                            fillOpacity: 1,
                            strokeColor: '#FFFFFF',
                            strokeWeight: 3,
                        }
                    });
                    markersRef.current.push(userMarker);
                }

                // Add Filtered Markers
                filteredLocations.forEach(loc => {
                    const isBooth = loc.type === 'BOOTH';
                    const markerColor = isBooth ? '#FF65A3' : '#00529C';

                    // SVG Marker Pin
                    const svgPin = {
                        path: 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z',
                        fillColor: markerColor,
                        fillOpacity: 1,
                        strokeColor: '#FFFFFF',
                        strokeWeight: 2,
                        scale: 1.8,
                        anchor: new window.google.maps.Point(12, 22)
                    };

                    const marker = new window.google.maps.Marker({
                        position: { lat: loc.lat, lng: loc.lng },
                        map: map,
                        title: loc.name,
                        icon: svgPin,
                        animation: window.google.maps.Animation.DROP
                    });

                    // InfoWindow Content
                    const contentString = `
                        <div style="font-family: 'Kanit', sans-serif; padding: 4px; max-width: 260px;">
                            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
                                <span style="background-color: ${isBooth ? '#FF65A3' : '#00529C'}; color: #FFF; font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 12px;">
                                    ${isBooth ? 'บูธกิจกรรม' : 'ตู้กดสินค้า'}
                                </span>
                                ${loc.isDemo ? '<span style="background-color: #FEF3C7; color: #D97706; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; border: 1px solid #FCD34D;">DEMO</span>' : ''}
                            </div>
                            <h4 style="font-size: 14px; font-weight: bold; color: #0F172A; margin: 0 0 4px 0;">${loc.name}</h4>
                            <p style="font-size: 11px; color: #475569; margin: 0 0 8px 0; line-height: 1.4;">${loc.address}</p>
                            <p style="font-size: 11px; color: #64748B; margin: 0 0 8px 0;"><i class="fa-regular fa-clock"></i> ${loc.time}</p>
                            ${loc.distance ? `<p style="font-size: 11px; font-weight: bold; color: #00529C; margin: 0 0 8px 0;"><i class="fa-solid fa-location-arrow"></i> ห่างจากคุณ ${loc.distance} กม.</p>` : ''}
                            <div style="display: flex; gap: 4px; margin-top: 8px;">
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}" target="_blank" rel="noopener noreferrer" style="flex: 1; text-align: center; background-color: #00529C; color: #FFF; font-size: 11px; font-weight: bold; padding: 6px 10px; border-radius: 8px; text-decoration: none;">
                                    <i class="fa-solid fa-diamond-turn-right"></i> นำทาง Google Maps
                                </a>
                            </div>
                        </div>
                    `;

                    const infoWindow = new window.google.maps.InfoWindow({
                        content: contentString
                    });

                    marker.addListener('click', () => {
                        if (activeInfoWindowRef.current) {
                            activeInfoWindowRef.current.close();
                        }
                        infoWindow.open(map, marker);
                        activeInfoWindowRef.current = infoWindow;
                        setSelectedLocation(loc);
                    });

                    markersRef.current.push(marker);
                });

            }, [isMapLoaded, filteredLocations, userCoords]);

            // Select Location from sidebar
            const handleSelectLocation = (loc) => {
                setSelectedLocation(loc);
                if (gmapInstanceRef.current && window.google && window.google.maps) {
                    gmapInstanceRef.current.panTo({ lat: loc.lat, lng: loc.lng });
                    gmapInstanceRef.current.setZoom(15);
                }
            };

            const handleResetMapCenter = () => {
                if (gmapInstanceRef.current && window.google && window.google.maps) {
                    gmapInstanceRef.current.panTo({ lat: 13.7460, lng: 100.5348 });
                    gmapInstanceRef.current.setZoom(12);
                    showToast('รีเซ็ตตำแหน่งแผนที่ไปยังศูนย์กลางกรุงเทพฯ เรียบร้อย');
                }
            };

            const handleShareLocation = (loc) => {
                const shareText = `มาพบกับ Breeze Capsules 5in1 ได้ที่: ${loc.name} (${loc.address})! ดูบน Google Maps: https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}`;
                
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareText);
                    showToast('คัดลอกข้อความแชร์ตำแหน่งเรียบร้อยแล้ว!');
                } else {
                    const textArea = document.createElement('textarea');
                    textArea.value = shareText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showToast('คัดลอกข้อความแชร์ตำแหน่งเรียบร้อยแล้ว!');
                }
            };

            const handleSpinVoucher = () => {
                const discounts = [
                    { code: 'BREEZE20', title: 'ส่วนลด 20 บาท สำหรับ Breeze Capsules ทุกสูตร' },
                    { code: 'FREE1PK', title: 'รับฟรี! สินค้าตัวอย่าง Breeze Capsule 1 ถุง' },
                    { code: 'BUY2GET1', title: 'โปรโมชันพิเศษ ซื้อ 2 แถม 1 ที่ตู้ Breeze Vending' }
                ];
                const random = discounts[Math.floor(Math.random() * discounts.length)];
                setClaimedVoucher(random);
            };

            return (
                <div class="min-h-screen flex flex-col relative bg-slate-50">

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-bounce border border-breeze-cyan">
                            <i class="fa-solid fa-circle-check text-breeze-cyan text-xl"></i>
                            <span class="text-sm font-medium">{toastMessage}</span>
                        </div>
                    )}

                    {/* Background Bubble Effect */}
                    <div class="bubble-container">
                        <div class="bubble w-12 h-12 left-[10%]" style={{ animationDelay: '0s' }}></div>
                        <div class="bubble w-8 h-8 left-[25%]" style={{ animationDelay: '2s' }}></div>

                        <div class="bubble w-10 h-10 left-[70%]" style={{ animationDelay: '1s' }}></div>

                    a: 'ควรเก็บในที่แห้ง พ้นจากแสงแดดและความชื้น ปิดซิปล็อคถุงให้สนิททุกครั้งหลังใช้งาน และเก็บให้พ้นมือเด็กและสัตว์เลี้ยง ห้ามรับประทานหรือจับแคปซูลด้วยมือที่เปียกชื้น'
                }
            ];

            return (
                <div class="space-y-4">
                    {faqs.map((faq, index) => {
                        const isOpen = openIndex === index;
                        return (
                            <div 
                                key={index} 
                                class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm transition"
                            >
                                <button 
                                    onClick={() => setOpenIndex(isOpen ? null : index)}
                                    class="w-full text-left p-5 font-bold text-slate-800 text-sm sm:text-base flex items-center justify-between gap-4 focus:outline-none"
                                >
                                    <span>{faq.q}</span>
                                    <i class={`fa-solid fa-chevron-down transition-transform duration-300 text-breeze-blue ${isOpen ? 'rotate-180' : ''}`}></i>
                                </button>

                                {isOpen && (
                                    <div class="p-5 pt-0 text-xs sm:text-sm text-slate-600 leading-relaxed border-t border-slate-100 bg-slate-50/50">
                                        {faq.a}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
